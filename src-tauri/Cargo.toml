[package]
name = "helix"
version = "0.1.0"
description = "Helix - a portable assistant"
edition = "2021"
rust-version = "1.77"

[lib]
# The shell is a library plus a thin binary, so the same code can be exercised
# by tests and by the desktop entry point.
name = "helix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Real volume statistics. This is the whole reason the storage screen cannot
# tell the truth in a browser: an origin quota is not free disk space, and
# nothing in a page can see the difference.
sysinfo = "0.32"
# Inference requests are made here rather than in the web view, because this
# is the only side of the boundary where an API key can be held without being
# readable by the page.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }
# PKCE. The code challenge is a SHA-256 of the verifier, base64url-encoded;
# the encoding is written out in google.rs because it is twenty lines, but a
# hand-rolled hash would be a different matter entirely.
sha2 = "0.10"
# Cryptographic randomness for the PKCE verifier and the state value. Already
# in the tree beneath the TLS stack; named here because this code depends on
# it directly and a weak source would make PKCE decorative.
getrandom = "0.3"
# URL parsing and joining for redirect handling. Already in the tree beneath
# reqwest; named because web.rs depends on it directly to re-check every hop.
url = "2"

[features]
# Kept so a release build can be produced without the devtools payload.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
