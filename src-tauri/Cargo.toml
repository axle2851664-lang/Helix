[package]
name = "helix"
version = "0.1.0"
description = "Helix - a portable assistant"
edition = "2021"
rust-version = "1.77"

[lib]
# The shell is a library plus a thin binary, so the same code can be exercised
# by tests and by the desktop entry point.
name = "helix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Real volume statistics. This is the whole reason the storage screen cannot
# tell the truth in a browser: an origin quota is not free disk space, and
# nothing in a page can see the difference.
sysinfo = "0.32"

[features]
# Kept so a release build can be produced without the devtools payload.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
